# ============================================================
# Configuration de l'API Actualites
# ============================================================

spring.application.name=actualites-api
server.port=8080

# ------------------------------------------------------------
# DevTools
#
# Le rechargement a chaud est desactive : il recharge les
# classes sans toujours reconstruire le contexte Spring de
# facon coherente, ce qui produit des NoClassDefFoundError
# fantomes des qu'on ajoute un bean.
# ------------------------------------------------------------
spring.devtools.restart.enabled=false

# ------------------------------------------------------------
# Base de donnees
#
# Port 5434 : 5432 et 5433 sont occupes par d'autres projets.
# Les identifiants correspondent au docker-compose.yml.
# ------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5434/actualites_db
spring.datasource.username=actualites_user
spring.datasource.password=actualites_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------
# JPA / Hibernate
#
# ddl-auto=none : le schema est maitrise par schema.sql, pas
# genere par Hibernate. En production, laisser Hibernate
# modifier les tables est un risque.
#
# open-in-view=false : ferme la session Hibernate a la fin du
# service, pas a la fin de la requete. Force a charger
# explicitement ce dont on a besoin, ce qui rend les
# chargements paresseux visibles au lieu de les masquer.
#
# Le dialecte n'est pas declare : Hibernate 7 le deduit de
# l'URL JDBC et signale la propriete comme inutile.
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ------------------------------------------------------------
# Initialisation du schema et des donnees
#
# always : schema.sql et data.sql sont rejoues a chaque
# demarrage. Les scripts sont donc idempotents (IF NOT EXISTS,
# ON CONFLICT DO NOTHING).
#
# continue-on-error=false : une erreur dans un script arrete le
# demarrage. Demarrer sur un schema incomplet produirait des
# pannes difficiles a diagnostiquer plus tard.
#
# defer-datasource-initialization : execute les scripts APRES
# l'initialisation de JPA, pas avant.
# ------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=true

# ------------------------------------------------------------
# Securite : JWT

application.securite.jwt.secret=${JWT_SECRET}
application.securite.jwt.acces-validite-ms=900000
application.securite.jwt.rafraichissement-validite-ms=604800000

# ------------------------------------------------------------
# CORS

# 10.0.2.2 est l'alias de la machine hote vu depuis l'emulateur
# Android.
# ------------------------------------------------------------
application.cors.origines=http://localhost:3000,http://localhost:4200,http://localhost:8080,http://10.0.2.2:8080

# ------------------------------------------------------------
# Documentation OpenAPI
# ------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ------------------------------------------------------------
# Journalisation
#

logging.level.root=INFO
logging.level.iibs.actualites=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%logger{36}] - %msg%n

# ------------------------------------------------------------
# Jackson
#
# Les champs nuls sont exclus des reponses : allege le JSON
# envoye au client mobile.
#
# Jackson 3 (Spring Boot 4) serialise les dates au format ISO
# par defaut.
# ------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null