# ============================================================
# Configuration de l'API Actualites
# ============================================================

spring.application.name=actualites-api
server.port=${PORT:8080}

# ------------------------------------------------------------
# DevTools
#
# Le rechargement a chaud est desactive : il recharge les
# classes sans toujours reconstruire le contexte Spring de
# facon coherente, ce qui produit des NoClassDefFoundError
# fantomes des qu'on ajoute un bean.
# ------------------------------------------------------------
spring.devtools.restart.enabled=false

# ------------------------------------------------------------
# Base de donnees
#
# L'URI complete (avec utilisateur, mot de passe et nom de
# base) vient de la variable d'environnement MONGODB_URI.
# En local, docker-compose.yml expose un MongoDB sur le port
# 27018 (27017 est deja occupe par d'autres projets) et
# application-local.properties pointe dessus.
spring.mongodb.uri=${MONGODB_URI}
application.securite.jwt.secret=${JWT_SECRET}
spring.data.mongodb.auto-index-creation=true

# ------------------------------------------------------------
# Securite : JWT
application.securite.jwt.acces-validite-ms=900000
application.securite.jwt.rafraichissement-validite-ms=604800000

# ------------------------------------------------------------
# CORS

# 10.0.2.2 est l'alias de la machine hote vu depuis l'emulateur
# Android.
# ------------------------------------------------------------
application.cors.origines=${CORS_ORIGINES:http://localhost:3000,http://localhost:4200,http://localhost:8080,http://10.0.2.2:8080}

# ------------------------------------------------------------
# Documentation OpenAPI
# ------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ------------------------------------------------------------
# Journalisation
#

logging.level.root=INFO
logging.level.iibs.actualites=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb.core=INFO

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%logger{36}] - %msg%n

# ------------------------------------------------------------
# Actuator
#
# Le endpoint /actuator/health est utilise par Render pour
# verifier que le service est pret a recevoir du trafic.
# ------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ------------------------------------------------------------
# Jackson
#
# Les champs nuls sont exclus des reponses : allege le JSON
# envoye au client mobile.
#
# Jackson 3 (Spring Boot 4) serialise les dates au format ISO
# par defaut.
# ------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
