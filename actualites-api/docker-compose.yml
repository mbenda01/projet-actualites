services:
  actualites-db:
    image: mongo:7
    container_name: actualites-db
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: actualites_user
      MONGO_INITDB_ROOT_PASSWORD: actualites_pass
      MONGO_INITDB_DATABASE: actualites_db

    ports:
      - "27018:27017"

    volumes:
      - actualites-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  actualites-data:
    name: actualites-data
